packages:
  - apps/*

publicHoistPattern:
  - '*postcss*'
  - '@commitlint/*'
  - czg

strictPeerDependencies: false
autoInstallPeers: true
dedupePeerDependents: true
verifyDepsBeforeRun: false
minimumReleaseAge: 0

overrides:
  pinia: 'catalog:'
  vue: 'catalog:'

catalog:
  '@ant-design/icons-vue': ^7.0.1
  '@types/lodash-es': ^4.17.12
  '@types/nprogress': ^0.2.3
  '@vitejs/plugin-vue': ^6.0.8
  '@vitejs/plugin-vue-jsx': ^5.1.6
  '@vueuse/core': ^14.3.0
  ant-design-vue: ^4.2.6
  axios: ^1.18.1
  dayjs: ^1.11.21
  lodash-es: ^4.17.21
  lucide-vue-next: ^1.0.0
  nprogress: ^0.2.0
  pinia: ^4.0.2
  typescript: ^6.0.3
  vite: ^8.2.1
  vue: ^3.5.40
  vue-i18n: ^11.4.7
  vue-router: ^5.2.0
  vue-tsc: ^3.3.9

onlyBuiltDependencies:
  - '@parcel/watcher'
  - 'core-js'
  - 'esbuild'
