# 单包模式（已从 apps/web-antd 迁移到根目录）
# packages 声明保留以兼容 pnpm workspace 特性，但不再引用 apps/
packages:
  - .

publicHoistPattern:
  - '*postcss*'
  - '@commitlint/*'
  - czg

strictPeerDependencies: false
autoInstallPeers: true
dedupePeerDependents: true
verifyDepsBeforeRun: false
minimumReleaseAge: 0

overrides:
  pinia: 'catalog:'
  vue: 'catalog:'

catalog:
  '@lucide/vue': ^1.37.0
  '@tailwindcss/vite': ^4.3.3
  '@types/lodash-es': ^4.17.12
  '@types/nprogress': ^0.2.3
  '@vitejs/plugin-vue': ^6.0.8
  '@vitejs/plugin-vue-jsx': ^5.1.6
  '@vueuse/core': ^14.3.0
  axios: ^1.18.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  dayjs: ^1.11.21
  lodash-es: ^4.17.21
  lucide-vue-next: ^1.0.0
  nprogress: ^0.2.0
  pinia: ^4.0.2
  reka-ui: ^2.10.4
  shadcn-vue: ^2.8.2
  tailwind-merge: ^2.6.1
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^6.0.3
  vite: ^8.2.1
  vue: ^3.5.40
  vue-i18n: ^11.4.7
  vue-router: ^5.2.0
  vue-tsc: ^3.3.9

onlyBuiltDependencies:
  - '@parcel/watcher'
  - 'core-js'
  - 'esbuild'

allowBuilds:
  '@parcel/watcher': false
  core-js: set this to true or false
  esbuild: false
  vue-demi: false
